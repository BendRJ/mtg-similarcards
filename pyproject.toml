[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "mtg-similarcards"
version = "0.1.0"
description = "App for identifying similar mtg cards via vector embeddings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "isort>=8.0.1",
    "logging>=0.4.9.6",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    "sentence-transformers>=3.0.0",
    "datasets>=2.14.0",
    "accelerate>=0.21.0",
    "fastapi[standard]>=0.141.1",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pylint>=4.0.5",
    "pywho>=0.3.3",
]
